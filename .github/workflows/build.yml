name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      # The release key, from repository secrets. Pull requests and forks have no secrets: they
      # still build and test, and publish nothing.
      - name: Signing key
        id: key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key: building with the debug key, nothing will be published."
          fi

      - name: APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          version=$(( ${{ github.run_number }} + 10 ))
          echo "VERSION_CODE=$version" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "poll-alarm-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: poll-alarm-${{ env.VERSION_CODE }}
          path: poll-alarm-${{ env.VERSION_CODE }}.apk
          retention-days: 7

      # The app updates itself from the latest release (app/src/main/java/org/halachmi/polls/Updater.kt),
      # matching the asset name poll-alarm-<versionCode>.apk.
      - name: Release
        if: github.ref == 'refs/heads/main' && steps.key.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.VERSION_CODE }}
          name: 1.0.${{ env.VERSION_CODE }}
          files: poll-alarm-${{ env.VERSION_CODE }}.apk
          make_latest: true

      - name: Keep the newest 5 releases
        if: github.ref == 'refs/heads/main' && steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '[.[].tagName | select(test("^v1\\.0\\.[0-9]+$"))] | sort_by(ltrimstr("v1.0.") | tonumber) | reverse | .[5:] | .[]' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
